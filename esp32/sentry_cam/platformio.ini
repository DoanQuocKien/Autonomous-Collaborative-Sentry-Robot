; ESP32-CAM (AI-Thinker) firmware, built with PlatformIO inside VS Code (no Arduino IDE needed).
; Open the folder esp32/sentry_cam in VS Code, then use the PlatformIO toolbar (build / upload / serial monitor),
; or:  pio run  /  pio run -t upload  /  pio device monitor
; Before the first build: copy secrets.example.h to secrets.h and fill in the hotspot name and password
; (secrets.h is gitignored). The ESP32 only joins a 2.4 GHz network.

[platformio]
src_dir = .

[env:esp32cam]
; espressif32 6.9.0 = Arduino-ESP32 core 2.0.17, the well-tested core for camera boards (pinned on purpose)
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  ; verbose core log (5) prints 'Camera PID=0x....' during esp_camera_init: use it to debug "camera not supported"
  -DCORE_DEBUG_LEVEL=5
