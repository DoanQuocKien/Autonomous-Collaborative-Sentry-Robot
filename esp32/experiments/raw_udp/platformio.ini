; Test: ESP32-CAM sends raw RGB565 frames over UDP to the laptop (tools/esp_raw_rx.py). For sensors without hardware JPEG (GC2145).
[platformio]
src_dir = .

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -I../../sentry_cam
  -DCORE_DEBUG_LEVEL=1
