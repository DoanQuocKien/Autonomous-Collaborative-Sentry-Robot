; Raw camera frame rate for each pixel format / size / camera clock: frames are grabbed and returned, nothing else runs (no Wi-Fi, no encoding).
[platformio]
src_dir = .

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -I../../sentry_cam
  -DCORE_DEBUG_LEVEL=1
