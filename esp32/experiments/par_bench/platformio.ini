; Parallel JPEG encode test: one vs two encoders on two cores, full VGA vs 640x320 crop (real camera frame, no Wi-Fi).
[platformio]
src_dir = .

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -I../../sentry_cam
  -DCORE_DEBUG_LEVEL=1
  -I../../lib_shared/esp_new_jpeg/include
  -L../../lib_shared/esp_new_jpeg/lib
  -lesp_new_jpeg
