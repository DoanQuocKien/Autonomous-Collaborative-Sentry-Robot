; ESP32-CAM (GC2145, no hardware JPEG): YUV422 capture + Espressif esp_new_jpeg dual-core encode + JPEG over UDP to the laptop (tools/esp_raw_rx.py).
[platformio]
src_dir = .

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -I../../sentry_cam
  -DCORE_DEBUG_LEVEL=1
  -I../../lib_shared/esp_new_jpeg/include
  -L../../lib_shared/esp_new_jpeg/lib
  -lesp_new_jpeg
