; OV2640 hardware-JPEG frame rate and a sample frame over serial, no Wi-Fi (esp32/sentry_cam is the streaming firmware).
[platformio]
src_dir = .

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -I../../sentry_cam
  -DCORE_DEBUG_LEVEL=1
