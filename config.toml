# ALL tunables live here (laptop side). Hardware needs tuning; never hardcode these in modules.
# Jetson-side motor calibration (k, min_pwm) lives in calib/motion.json instead: Jetson Python 3.6 has no TOML reader.

[net]
jetbot_ip = "auto"             # scanned on the laptop's network each run (tools/find_jetbot.py); or a fixed IP
esp32_ip = "auto"             # tools/record.py: the local relay (tools/esp_mjpeg_relay.py, GC2145 boards) if running, else the first LAN host with port 81 open (OV2640 board); or a fixed IP
video_port = 5555
control_port = 5556
clock_port = 5557
control_rate_hz = 30
clock_samples = 20
clock_timeout_s = 0.5
video_rcvhwm = 2                 # multipart cannot use ZMQ_CONFLATE; drain complete messages
video_poll_ms = 20
video_drain_limit = 64           # bound drain work so shutdown/decode cannot starve
video_join_timeout_s = 2.0

[telemetry]
duration_s = 30.0
frame_timeout_s = 1.0
latency_p95_limit_ms = 50.0
min_fps = 20.0

[profiling]
models = ["yolov8n.pt", "yolov8s.pt"]
imgsz = 640
warmup = 10
iterations = 100
seed = 532
device = 0

[camera]
width = 640
height = 480
fps = 20
jpeg_quality = 60

[safety]
watchdog_s = 0.3                 # Jetson stops motors after this much command silence
# The HIL speed cap is NOT here: the Jetson cannot read TOML. It is robot_udp.py --max-speed (0.3 in jetson/systemd/sentry-control.service).

[thresholds]                     # from the spec; change only with a documented reason
obstacle_explore_m = 0.6
obstacle_pursuit_m = 0.5
whitelist_cosine = 0.45
entrance_min_m = 1.5
entrance_max_m = 3.0
standoff_m = 1.2
stationary_speed_mps = 0.1
stationary_time_s = 2.0
stationary_exit_speed_mps = 0.2   # proposed hysteresis for leaving HOLD; tune in W5
strike_area_growth = 0.40
strike_window_s = 0.1
evade_v = -1.0
evade_w = 0.8
evade_duration_s = 0.4

[calibration]
checkerboard_inner_corners = [9, 6]   # columns, rows (10 x 7 squares)
checkerboard_square_m = 0.025         # MEASURE the printed board and update this
aruco_dict = "DICT_4X4_50"
aruco_marker_m = 0.15                 # the 150 mm prints (assets/print/*150mm.pdf); measured 0.15 on 2026-10-14
aruco_square_above_page_m = 0.132     # black square lower edge above the A4 page bottom: fixed by tools/make_markers.py (tests/test_camera_pose.py checks it)
aruco_page_bottom_h_m = 0.0           # pages stand on the floor against the wall; raise if a page is mounted higher (square lower edge = this + the line above)

[entrance]                      # perception/entrance.py: XFeat (+ DINOv2); defaults from the D1 bake-off 2026-10-12, one entrance door per room
policy = "auto"                  # auto (XFeat with a robot-eye reference, else DINOv2) | xfeat | dino | and | or
xfeat_top_k = 2048
min_inliers = 27                 # XFeat RANSAC inliers; calibrate() raises it above the room's negatives
ransac_px = 5.0
min_area_ratio = 0.05            # hull of the inliers: frame area / reference area, rejects degenerate homographies
max_area_ratio = 8.0
dino_size = "b"                  # "s" on a CPU-only laptop
dino_margin = 0.02               # added to the 99th percentile of the negatives' cosine similarity
enter_frames = 3                 # EntranceFilter: ENTRANCE_FOUND after this many consecutive in-view frames
exit_frames = 5                  # ENTRANCE_LOST after this many without

[search]                        # map-based coverage search after the active intruder exits
detection_radius_m = 3.0         # PLACEHOLDER r_det; DQK measures it in W9
coverage_target = 0.90           # fraction of known-free cells the planned viewpoints must cover

[obstacle]
weights = "data/models/yolov8n.pt" # existing local weights; inference never downloads implicitly
device = "0"                    # use "cpu" for offline CPU work
imgsz = 640
confidence = 0.25
class_ids = [56, 57, 58, 59, 60, 62, 72, 28] # chair,couch,plant,bed,table,tv,fridge,suitcase
camera_calibration = "calib/camera.json"
camera_pose = "calib/camera_pose_nowedge.json"
max_ground_range_m = 5.0
border_margin_px = 1.0           # reject truncated boxes on every image border
floor_type = "unknown"           # explicitly select glossy/matte per recording; unknown -> unresolved
pose_max_rms_m = 0.03
reflection_window_px = 12
reflection_max_shift_px = 24
reflection_min_trim_px = 2
reflection_min_score = 0.85
reflection_min_std = 5.0
reflection_min_peak_margin = 0.10
reflection_peak_separation_px = 3.0
reflection_flank_px = 12
repulsion_gain = 1.0
repulsion_max_w = 1.0            # normalized UDP w contribution, not rad/s
centre_turn = 1                  # deterministic left turn for an exactly centred obstacle

[floor_segmentation]             # optional Issue #43 backend: enable explicitly after fetching weights
enabled = false                 # opt in via --semantic-floor; inference stays offline
model_path = "data/models/segformer-b0-ade"
device = "cuda:0"
floor_ids = [3, 28]              # ADE20K floor, rug; carpet belongs to these labels
ignore_label_ids = [0, 1, 2, 5, 6, 8, 9, 13, 14, 21, 26, 27] # stuff/sky/glass are not small-object proposals
floor_confidence = 0.60
object_confidence = 0.45
min_component_px = 16
max_component_fraction = 0.35
contact_search_px = 20
contact_above_px = 35
contact_strip_px = 3
contact_min_contrast = 5.0
contact_min_columns = 3
contact_cluster_px = 4
contact_background_px = 15
contact_floor_fraction = 0.6
candidate_overlap = 0.5          # skip semantic proposals already covered by a YOLO box

[open_vocabulary]                # optional Issue #43 offline prompt-bound YOLO-World
enabled = false
weights = "data/models/obstacles-world.pt"
device = "0"
imgsz = 960
confidence = 0.10                # exploratory proposals; evaluate missed and unmatched boxes
nms_iou = 0.50
floor_crop_fraction = 0.55
tiles = 2
tile_overlap = 0.2
prompts = ["shoe", "bag", "laptop sleeve", "charger", "cup", "computer mouse", "laptop stand", "power strip", "phone", "bottle", "keys", "book", "jacket", "laptop", "cable"]

[gridmap]
resolution_m = 0.10
width_m = 20.0
height_m = 20.0
origin_x_m = -10.0
origin_y_m = -10.0
driven_radius_m = 0.12           # MEASURE robot footprint; this is a development default
camera_forward_m = 0.0          # MEASURE offset lens -> localization origin before HIL
camera_left_m = 0.0

[vantage]
robot_radius_m = 0.15           # MEASURE footprint + clearance margin before HIL
boundary_weight = 1.0
distance_weight = 0.2

[w2_validation]
min_obstacles = 20
min_tape_m = 0.3
max_tape_m = 2.0
distance_median_relative_limit = 0.10
distance_p90_relative_limit = 0.20
map_error_limit_m = 0.20
map_fraction_min = 0.80
required_floor_types = ["glossy", "matte"]

[sim]
v_max_mps = 0.5                  # Simulated max linear velocity in m/s
w_max_radps = 2.0                # Simulated max angular velocity in rad/s
loop_hz = 50                     # Simulation loop rate
