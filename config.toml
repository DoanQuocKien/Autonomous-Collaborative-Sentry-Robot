# ALL tunables live here (laptop side). Hardware needs tuning; never hardcode these in modules.
# Jetson-side motor calibration (k, min_pwm) lives in calib/motion.json instead: Jetson Python 3.6 has no TOML reader.

[net]
jetbot_ip = "auto"             # scanned on the laptop's network each run (tools/find_jetbot.py); or a fixed IP
esp32_ip = "auto"             # tools/record.py: the local relay (tools/esp_mjpeg_relay.py, GC2145 boards) if running, else the first LAN host with port 81 open (OV2640 board); or a fixed IP
video_port = 5555
control_port = 5556
clock_port = 5557
control_rate_hz = 30
clock_samples = 20
clock_timeout_s = 0.5
video_rcvhwm = 2                 # multipart cannot use ZMQ_CONFLATE; drain complete messages
video_poll_ms = 20
video_drain_limit = 64           # bound drain work so shutdown/decode cannot starve
video_join_timeout_s = 2.0

[telemetry]
duration_s = 30.0
frame_timeout_s = 1.0
latency_p95_limit_ms = 50.0
min_fps = 20.0

[profiling]
models = ["yolov8n.pt", "yolov8s.pt"]
imgsz = 640
warmup = 10
iterations = 100
seed = 532
device = 0

[camera]
width = 640
height = 480
fps = 20
jpeg_quality = 60

[safety]
watchdog_s = 0.3                 # Jetson stops motors after this much command silence
# The HIL speed cap is NOT here: the Jetson cannot read TOML. It is robot_udp.py --max-speed (0.3 in jetson/systemd/sentry-control.service).

[thresholds]                     # from the spec; change only with a documented reason
obstacle_explore_m = 0.6
obstacle_pursuit_m = 0.5
whitelist_cosine = 0.45
entrance_min_m = 1.5
entrance_max_m = 3.0
standoff_m = 1.2
stationary_speed_mps = 0.1
stationary_time_s = 2.0
stationary_exit_speed_mps = 0.2   # proposed hysteresis for leaving HOLD; tune in W5
strike_area_growth = 0.40
strike_window_s = 0.1
evade_v = -1.0
evade_w = 0.8
evade_duration_s = 0.4

[calibration]
checkerboard_inner_corners = [9, 6]   # columns, rows (10 x 7 squares)
checkerboard_square_m = 0.025         # MEASURE the printed board and update this
aruco_dict = "DICT_4X4_50"
aruco_marker_m = 0.10                 # MEASURE the printed marker and update this

[search]                        # map-based coverage search after the active intruder exits
detection_radius_m = 3.0         # PLACEHOLDER r_det; DQK measures it in W9
coverage_target = 0.90           # fraction of known-free cells the planned viewpoints must cover

[obstacle]
weights = "data/models/yolov8n.pt" # existing local weights; inference never downloads implicitly
device = "0"                    # use "cpu" for offline CPU work
imgsz = 640
confidence = 0.25
class_ids = [56, 57, 58, 59, 60, 62, 72, 28] # chair,couch,plant,bed,table,tv,fridge,suitcase
camera_calibration = "calib/camera.json"
camera_pose = "calib/camera_pose_nowedge.json"
max_ground_range_m = 5.0
bottom_margin_px = 1.0           # reject boxes touching the bottom: contact point is not visible
repulsion_gain = 1.0
repulsion_max_w = 1.0            # normalized UDP w contribution, not rad/s
centre_turn = 1                  # deterministic left turn for an exactly centred obstacle

[gridmap]
resolution_m = 0.10
width_m = 20.0
height_m = 20.0
origin_x_m = -10.0
origin_y_m = -10.0
driven_radius_m = 0.12           # MEASURE robot footprint; this is a development default
camera_forward_m = 0.0          # MEASURE offset lens -> localization origin before HIL
camera_left_m = 0.0

[vantage]
robot_radius_m = 0.15           # MEASURE footprint + clearance margin before HIL
boundary_weight = 1.0
distance_weight = 0.2

[w2_validation]
min_obstacles = 20
min_tape_m = 0.3
max_tape_m = 2.0
distance_median_relative_limit = 0.10
distance_p90_relative_limit = 0.20
map_error_limit_m = 0.20
map_fraction_min = 0.80

[sim]
v_max_mps = 0.5                  # Simulated max linear velocity in m/s
w_max_radps = 2.0                # Simulated max angular velocity in rad/s
loop_hz = 50                     # Simulation loop rate
